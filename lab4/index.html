<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Форма студентської картки</title>
  </head>
  <body>
    <header>
      <h1>Студентська картка</h1>
    </header>

    <main>
      <form action="#" method="post" enctype="multipart/form-data">
        <section>
          <h2>Особиста інформація</h2>
          <fieldset>
            <legend>Вкажіть свої дані</legend>

            <p>
              <label for="fullName">Повне ім'я:</label>
              <input
                type="text"
                id="fullName"
                name="fullName"
                placeholder="Введіть своє повне ім'я"
                required
                minlength="3"
                maxlength="10"
                pattern="^[A-Za-zА-Яа-яІіЇїЄєҐґ'\s]+$"
              />
            </p>

            <p>
              <label for="email">Електронна пошта:</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Введіть свою електронну пошту"
                required
              />
            </p>

            <p>
              <label for="password">Пароль:</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Введіть пароль"
                required
                minlength="8"
                maxlength="32"
              />
            </p>

            <p>
              <label for="age">Вік:</label>
              <input
                type="number"
                id="age"
                name="age"
                min="16"
                max="100"
                required
              />
            </p>

            <p>
              <label for="dob">Дата народження:</label>
              <input
                type="date"
                id="dob"
                name="dob"
                required
                min="1920-01-01"
                max="2010-12-31"
              />
            </p>

            <fieldset>
              <legend>Стать:</legend>
              <label>
                <input type="radio" name="gender" value="male" required />
                Чоловіча </label
              ><br />
              <label>
                <input type="radio" name="gender" value="female" />
                Жіноча </label
              ><br />
              <label>
                <input type="radio" name="gender" value="other" /> Інша
              </label>
            </fieldset>

            <fieldset>
              <legend>Знання мов:</legend>
              <label>
                <input type="checkbox" name="languages" value="english" />
                Англійська </label
              ><br />
              <label>
                <input type="checkbox" name="languages" value="spanish" />
                Іспанська </label
              ><br />
              <label>
                <input type="checkbox" name="languages" value="french" />
                Французька
              </label>
            </fieldset>

            <p>
              <label for="country">Країна:</label>
              <select id="country" name="country" required>
                <option value="" disabled selected>Оберіть свою країну</option>
                <option value="ukraine">Україна</option>
                <option value="usa">США</option>
                <option value="uk">Велика Британія</option>
                <option value="poland">Польща</option>
                <option value="germany">Німеччина</option>
              </select>
            </p>
          </fieldset>
        </section>

        <section>
          <h2>Навчальні предмети</h2>
          <fieldset>
            <legend>Оберіть свої предмети</legend>

            <p>
              <label for="subjects">Оберіть предмети:</label><br />
              <select id="subjects" name="subjects" multiple size="5" required>
                <option value="mathematics">Математика</option>
                <option value="computer_science">Інформатика</option>
                <option value="physics">Фізика</option>
                <option value="chemistry">Хімія</option>
                <option value="english">Англійська мова</option>
              </select>
            </p>

            <p>
              <label for="interest">Оцініть свій інтерес до інформатики:</label
              ><br />
              <input
                type="range"
                id="interest"
                name="interest"
                min="1"
                max="10"
                step="1"
                value="5"
              />
            </p>
          </fieldset>
        </section>
        

        <section>
          <h2>Оцінювання навичок</h2>
          <fieldset>
            <legend>Оцініть свої навички</legend>

            <p>
              <label for="skills">Опишіть свої навички:</label><br />
              <textarea
                id="skills"
                name="skills"
                rows="4"
                cols="45"
                placeholder="Перелічіть свої навички тут..."
                minlength="10"
                maxlength="500"
              ></textarea>
            </p>

            <p>
              <label for="resume">Завантажте своє резюме:</label>
              <input
                type="file"
                id="resume"
                name="resume"
                accept=".pdf,.doc,.docx"
              />
            </p>

            <p>
              <label for="favColor">Оберіть свій улюблений колір:</label>
              <input
                type="color"
                id="favColor"
                name="favColor"
                value="#000000"
              />
            </p>

            <p>
              <label for="studyTime">Бажаний час навчання:</label>
              <input type="time" id="studyTime" name="studyTime" required />
            </p>

            <p>
              <input type="submit" value="Надіслати форму" />
            </p>
          </fieldset>
        </section>
      </form>
    </main>

    <footer>
      <p> &copy; 2026 Студентська картка, автор Ігор Мацишин. Усі права захищено.</p>
    </footer>
  </body>
</html>
